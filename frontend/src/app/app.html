@if (authService.isAuthenticated()) {
  <header class="header">
    <button class="header__menu-btn" aria-label="{{ 'nav.menu' | translate }}" (click)="toggleSideMenu()">
      <shy-icon>list</shy-icon>
    </button>

    <h1 class="header__title">Helios</h1>

    <div class="header__actions">
      <button class="header__lang-btn" aria-label="{{ 'nav.toggle_language' | translate }}" (click)="toggleLanguage()">
        {{ languageService.currentLang() === 'pt-br' ? 'PT' : 'EN' }}
      </button>

      <button class="header__theme-btn" aria-label="{{ 'nav.toggle_theme' | translate }}" (click)="toggleTheme()">
        <shy-icon>moon-stars</shy-icon>
      </button>
    </div>
  </header>

  @if (isSideMenuOpen) {
    <div
      class="sidenav-backdrop"
      role="button"
      tabindex="0"
      aria-label="Fechar menu"
      (click)="closeSideMenu()"
      (keydown.enter)="closeSideMenu()"
      (keydown.escape)="closeSideMenu()"
    ></div>
  }

  <nav class="sidenav" [class.sidenav--open]="isSideMenuOpen">
    <div class="sidenav__content">
      <a routerLink="/dashboard" routerLinkActive="active" (click)="closeSideMenu()">
        {{ 'nav.dashboard' | translate }}
      </a>
      <a routerLink="/plants" routerLinkActive="active" (click)="closeSideMenu()">
        {{ 'nav.plants' | translate }}
      </a>
      <a routerLink="/devices" routerLinkActive="active" (click)="closeSideMenu()">
        {{ 'nav.devices' | translate }}
      </a>
      <button class="sidenav__logout" (click)="logout()">
        {{ 'nav.logout' | translate }}
      </button>
      <span class="sidenav__version">v{{ version }}</span>
    </div>
  </nav>
}

<main class="main">
  <router-outlet />
</main>
